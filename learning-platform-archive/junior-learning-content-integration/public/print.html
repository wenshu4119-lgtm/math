<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导出预览 · 学习规划</title><link rel="stylesheet" href="/print.css"></head><body>
<header class="print-toolbar"><div><strong id="preview-title">导出前检查</strong><p id="status" role="status" aria-live="polite">正在校验权限并读取最新数据…</p></div><div class="print-actions"><button id="retry" type="button">重新加载</button><button id="print" type="button" disabled>打印 / 保存为 PDF</button></div></header>
