plugins { id 'com.android.application' }
android {
    namespace 'uk.mrxu.learning.trial'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'uk.mrxu.learning.trial'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-trial'
